     city boards. 'city' rides on every hit as a custom parameter so the four sites stay
     distinguishable inside one property rather than needing four separate dashboards. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-88F80YY2NQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('set', 'city', 'Hub');
  gtag('config', 'G-88F80YY2NQ');

<style>
  /* Print Poster — a committed single look (flyer pinned to a dark wall), not a
     light/dark adaptive theme. Colors are painted explicitly rather than through
     mode-switching tokens, per the direction chosen. */
  *{box-sizing:border-box}
  html,body{margin:0; padding:0}
  body{
    background:#121110; color:#141210; font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    position:relative; overflow-x:hidden;
  }

  #bgCanvas{ position:fixed; inset:0; z-index:0; pointer-events:none; width:100%; height:100% }

  .wall{ width:100%; flex:1; display:flex; justify-content:center; padding:44px 16px 30px;
    position:relative; z-index:1; }

  .poster{
    width:100%; max-width:440px; background:#f2ede1; border:3px solid #141210;
    box-shadow:0 18px 0 -6px #00000000, 10px 14px 0 #00000055, 0 30px 60px #00000070;
    padding:26px 22px 22px; position:relative;
    background-image:radial-gradient(#14121014 1px,transparent 1.3px);
    background-size:6px 6px;
  }

  .stamp{
    position:absolute; top:14px; right:14px; width:94px; height:94px; border-radius:50%;
    background:#f2ede1; border:2.5px solid #141210; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2px; transform:rotate(8deg); text-align:center; box-shadow:3px 4px 0 #00000040;
    z-index:2;
  }
  .stamp .top{
    display:flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; letter-spacing:.08em;
    color:#1e8f4e; font-family:Georgia,serif;
  }
  .stamp b{ font-family:'Arial Narrow',Arial,sans-serif; font-size:24px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; color:#141210 }
  .stamp .bottom{ font-size:7.8px; letter-spacing:.05em; color:#141210; font-family:Georgia,serif; font-weight:700 }
  .stamp .dot{ width:7px; height:7px; border-radius:50%; background:#1e8f4e; display:inline-block;
    animation:pulse 1.8s ease-in-out infinite }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  @media (prefers-reduced-motion:reduce){ .stamp .dot{ animation:none } }

  .poster-head{ position:relative; z-index:1 }
  .mark{ width:150px; height:150px; margin:4px auto 14px; display:block }
  .mark circle{ fill:none; stroke:#ff6a2b; stroke-width:34 }
  .snake-canvas{ position:absolute; top:0; left:0; z-index:0; pointer-events:none }

  .eyebrow{ text-align:center; font-size:10.5px; letter-spacing:.3em; color:#c0392b; font-weight:700; }
  h1{
    font-family:'Arial Narrow',Arial,sans-serif; font-weight:900; font-size:52px; line-height:.86;
    letter-spacing:-1px; text-align:center; margin:8px 0 0; color:#141210; text-wrap:balance;
  }

  .ribbon{
    display:block; width:max-content; margin:14px auto 0; background:#c0392b; color:#f2ede1;
    font-family:'Arial Narrow',Arial,sans-serif; font-weight:800; font-size:12.5px; letter-spacing:.04em;
    padding:6px 16px; border:2px solid #141210; transform:rotate(-2deg); position:relative; z-index:1;
    font-variant-numeric:tabular-nums;
  }

  .tag{ text-align:center; font-size:11px; color:#4a4638; margin:16px 0 0; font-style:italic }

  .rule{ height:0; border-top:2.5px solid #141210; margin:20px 0 4px }

  .rows{ display:flex; flex-direction:column }
  .row{
    display:flex; align-items:center; gap:12px; padding:14px 2px; border-bottom:1.5px solid #14121033;
    text-decoration:none; color:#141210; opacity:0; transform:translateY(8px);
    animation:rise .45s ease forwards; animation-delay:calc(var(--i,0) * 70ms);
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) } }
  @media (prefers-reduced-motion:reduce){ .row{ animation:none; opacity:1; transform:none } }
  .row .name{ font-family:'Arial Narrow',Arial,sans-serif; font-weight:800; font-size:21px; letter-spacing:.01em }
  .row .place{ flex:1; font-size:11px; color:#5c584f; padding-left:2px }
  .row .n{
    font-family:'Arial Narrow',Arial,sans-serif; font-weight:800; font-size:13px; color:#141210;
    background:#f0b429; border:1.5px solid #141210; padding:3px 9px; flex:0 0 auto;
    font-variant-numeric:tabular-nums;
  }
  .row.soon{ opacity:.55 }
  .row.soon .n{ background:transparent; color:#5c584f; letter-spacing:.06em; font-size:10px }
  .row:not(.soon):active{ background:#14121008 }

  .cta{
    display:none; align-items:center; gap:12px; text-decoration:none; margin-top:20px;
    background:#141210; color:#f2ede1; padding:14px 16px; border:2px solid #141210;
    box-shadow:4px 4px 0 #c0392b;
  }
  .cta.on{ display:flex }
  .cta .ico{ width:30px; height:30px; border-radius:50%; background:#f2ede122; display:flex; align-items:center; justify-content:center; flex:0 0 auto }
  .cta .ico svg{ width:16px; height:16px; fill:#f2ede1 }
  .cta .body{ flex:1; min-width:0 }
  .cta .body b{ display:block; font-family:'Arial Narrow',Arial,sans-serif; font-weight:800; font-size:14px; letter-spacing:.02em }
  .cta .body span{ display:block; font-size:10.5px; color:#c9c2b0; margin-top:1px; font-style:italic }
  .cta .go{ font-family:'Arial Narrow',Arial,sans-serif; font-weight:800; font-size:12px; flex:0 0 auto }
  .cta .go::after{ content:" \2192" }

  .imprint{
    text-align:center; font-size:9px; letter-spacing:.12em; color:#5c584f; margin-top:18px;
    border-top:1px dashed #14121055; padding-top:10px; text-transform:uppercase;
  }
  .imprint a{ color:#5c584f }
</style>

<script>
(function(){
  "use strict";

  /* Add a state here when its board goes live. url:null keeps the row visible but
     unclickable and marked SOON, so people know a city is coming rather than
     wondering why it's missing entirely. */
  var STATES = [
    {state:"Delhi NCR",    city:"Delhi Circle",     init:"D",
     url:"https://delhi.inthecircle.in/"},
    {state:"Karnataka",    city:"Bangalore Circle", init:"B",
     url:"https://bangalore.inthecircle.in/"},
    {state:"Maharashtra",  city:"Mumbai Circle",    init:"M",
     url:"https://mumbai.inthecircle.in/"},
    {state:"Maharashtra",  city:"Pune Circle",      init:"P",
     url:"https://pune.inthecircle.in/"},
    {state:"Telangana",    city:"Hyderabad Circle", init:"H",
     url:"https://hyderabad.inthecircle.in/"}
  ];

  /* One WhatsApp community link for the whole Circle network. Paste the real
     chat.whatsapp.com/... invite link below to switch the CTA on — it stays
     hidden (display:none via the .cta class with no .on) until a link is set,
     so a placeholder can never accidentally ship as a dead button. */
  var WHATSAPP_URL = "https://chat.whatsapp.com/CyXadI3fYLsH31WUedPeil?s=hd&p=i&mlu=4&amv=2";
  var WHATSAPP_SUB = "Weekly picks, straight to your phone";

  var root = document.getElementById("states");
  STATES.forEach(function(s, i){
    var live = !!s.url;
    var el = document.createElement(live ? "a" : "div");
    el.className = "row " + (live ? "" : "soon");
    el.style.setProperty("--i", i);
    if (live) {
      el.href = s.url;
      el.addEventListener("click", function(){
        if (typeof gtag === "function") gtag("event", "state_click", {state: s.state, city: s.city});
      });
    }
    el.innerHTML =
      '<span class="name">' + s.city.replace(" Circle","").toUpperCase() + '</span>' +
      '<span class="place">' + s.state + '</span>' +
      '<span class="n" data-count-for="' + i + '">' + (live ? "" : "SOON") + '</span>';
    root.appendChild(el);
  });

  if (WHATSAPP_URL) {
    var cta = document.getElementById("cta");
    cta.href = WHATSAPP_URL;
    document.getElementById("ctaSub").textContent = WHATSAPP_SUB;
    cta.classList.add("on");
    cta.addEventListener("click", function(){
      if (typeof gtag === "function") gtag("event", "whatsapp_click", {source: "hub"});
    });
  }

  /* -------- small fun tweak: a hunter dot chasing a runner dot, Tom-and-Jerry style,
     each trailing a short fading line (like a snake). Both roam the whole header area
     but never cross below the rule where the city list (DELHI, etc.) starts - the
     canvas height is measured against .rule's actual position so this holds even if
     the header's content height changes. -------- */
  (function(){
    var poster = document.querySelector(".poster");
    var canvas = document.getElementById("snakeCanvas");
    var ruleEl = document.querySelector(".rule");
    if (!poster || !canvas || !canvas.getContext || !ruleEl) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;

    function resize(){
      var pr = poster.getBoundingClientRect();
      var rr = ruleEl.getBoundingClientRect();
      W = pr.width;
      H = Math.max(60, rr.top - pr.top - 6); // stop just above the rule / city list
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    var MAX_TRAIL_PX = 90; // ~1.5-3cm on a typical screen

    function hexToRgba(hex, a){
      var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return "rgba(" + parseInt(m[1],16) + "," + parseInt(m[2],16) + "," + parseInt(m[3],16) + "," + a.toFixed(2) + ")";
    }

    function makeActor(color, maxSpeed, shape){
      return {
        x: Math.random() * W, y: Math.random() * H, vx: 0.01, vy: 0.01,
        color: color, maxSpeed: maxSpeed, shape: shape || "dot", trail: [],
        targetX: Math.random() * W, targetY: Math.random() * H, retarget: 0,
        facingAngle: Math.random() * Math.PI * 2,
        jitterX: 0, jitterY: 0, jitterLeft: 0
      };
    }
    function lerpAngle(a, b, t){
      var diff = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      return a + diff * t;
    }
    var runner = makeActor("#f0b429", 2.4, "dot");     // gold - being chased
    var hunter = makeActor("#141210", 2.4, "pointer"); // ink - chasing, cursor-shaped
    // same top speed for both - the runner survives on tighter turning and a head
    // start on reacting, not on outrunning the hunter in a straight line

    function steer(actor, tx, ty, accel){
      var dx = tx - actor.x, dy = ty - actor.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      actor.vx += (dx / d) * accel;
      actor.vy += (dy / d) * accel;
      var sp = Math.sqrt(actor.vx * actor.vx + actor.vy * actor.vy);
      if (sp > actor.maxSpeed) { actor.vx = actor.vx / sp * actor.maxSpeed; actor.vy = actor.vy / sp * actor.maxSpeed; }
    }
    function move(actor){
      actor.x += actor.vx; actor.y += actor.vy;
      var m = 8;
      if (actor.x < m) { actor.x = m; actor.vx *= -0.5; }
      if (actor.x > W - m) { actor.x = W - m; actor.vx *= -0.5; }
      if (actor.y < m) { actor.y = m; actor.vy *= -0.5; }
      if (actor.y > H - m) { actor.y = H - m; actor.vy *= -0.5; }
    }
    function pushTrail(actor){
      actor.trail.push({ x: actor.x, y: actor.y });
      var len = 0;
      for (var i = actor.trail.length - 1; i > 0; i--) {
        var dx = actor.trail[i].x - actor.trail[i - 1].x, dy = actor.trail[i].y - actor.trail[i - 1].y;
        len += Math.sqrt(dx * dx + dy * dy);
        if (len > MAX_TRAIL_PX) { actor.trail = actor.trail.slice(i); break; }
      }
    }
    function drawTrail(actor){
      for (var j = 1; j < actor.trail.length; j++) {
        var a = actor.trail[j - 1], b = actor.trail[j], alpha = j / actor.trail.length;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = hexToRgba(actor.color, alpha * 0.7);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      if (actor.trail.length) {
        var head = actor.trail[actor.trail.length - 1];
        if (actor.shape === "pointer") {
          // ease the visual heading toward the real velocity angle rather than
          // snapping straight to it each frame - this is what makes the turn look
          // smooth instead of stiff, independent of how twitchy the steering itself is
          var targetAngle = Math.atan2(actor.vy, actor.vx);
          actor.facingAngle = lerpAngle(actor.facingAngle, targetAngle, 0.4);
          ctx.save();
          ctx.translate(head.x, head.y);
          ctx.rotate(actor.facingAngle);
          ctx.beginPath();
          ctx.moveTo(8, 0);      // tip, pointing the way it's moving
          ctx.lineTo(-5, 5);
          ctx.lineTo(-2.5, 0);   // back notch, gives it a cursor-arrow silhouette
          ctx.lineTo(-5, -5);
          ctx.closePath();
          ctx.fillStyle = actor.color;
          ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(head.x, head.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = actor.color;
          ctx.fill();
        }
      }
    }

    var DANGER_R = 24;  // runner only breaks away at the last moment - close calls are the point
    var MIN_GAP = 7;    // hard floor - a whisker apart at closest, but never touching

    function step(){
      var dx0 = runner.x - hunter.x, dy0 = runner.y - hunter.y;
      var gap = Math.sqrt(dx0 * dx0 + dy0 * dy0) || 1;

      if (gap < DANGER_R) {
        // close call - override the wander target and bolt directly away from the hunter
        var fleeX = runner.x + (dx0 / gap) * 120;
        var fleeY = runner.y + (dy0 / gap) * 120;
        steer(runner, fleeX, fleeY, 0.11);
        runner.retarget = 20; // pick a fresh wander goal shortly after escaping
      } else {
        runner.retarget--;
        if (runner.retarget <= 0) {
          runner.targetX = 10 + Math.random() * (W - 20);
          runner.targetY = 10 + Math.random() * (H - 20);
          runner.retarget = 25 + Math.random() * 30;
        }
        steer(runner, runner.targetX, runner.targetY, 0.075);
      }

      // hunter chases wherever the runner actually is right now, a little imperfectly -
      // it never quite gets there on purpose, so the gap above keeps winning the race
      // aim imperfection persists for a stretch of frames instead of re-rolling every
      // single frame - that constant re-rolling was what made the hunter's turning
      // look twitchy/stiff, since its steering target jumped around every frame
      hunter.jitterLeft--;
      if (hunter.jitterLeft <= 0) {
        hunter.jitterX = (Math.random() - 0.5) * 9;
        hunter.jitterY = (Math.random() - 0.5) * 9;
        hunter.jitterLeft = 10 + Math.random() * 12;
      }
      // same acceleration as the runner's own wander steer, so it curves and reacts
      // just as fast - the chase stays fair, and close, rather than one side feeling sluggish
      steer(hunter, runner.x + hunter.jitterX, runner.y + hunter.jitterY, 0.075);

      move(runner); move(hunter);

      // hard guarantee: whatever the steering did, never let them actually touch
      var dx1 = runner.x - hunter.x, dy1 = runner.y - hunter.y;
      var gap1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      if (gap1 < MIN_GAP) {
        var push = (MIN_GAP - gap1) / 2;
        var ux = gap1 > 0.001 ? dx1 / gap1 : 1, uy = gap1 > 0.001 ? dy1 / gap1 : 0;
        runner.x += ux * push; runner.y += uy * push;
        hunter.x -= ux * push; hunter.y -= uy * push;
      }

      pushTrail(runner); pushTrail(hunter);

      ctx.clearRect(0, 0, W, H);
      drawTrail(runner);
      drawTrail(hunter);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  /* -------- bouncing background orbs, poster ink colors -------- */
  (function(){
    var canvas = document.getElementById("bgCanvas");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var PALETTE = ["192,57,43", "240,180,41"]; // poster red, poster gold

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    var COUNT = 4;
    var balls = [];
    for (var i = 0; i < COUNT; i++) {
      var r = 46 + Math.random() * 46;
      balls.push({
        x: Math.random() * W, y: Math.random() * H, r: r, c: PALETTE[i % PALETTE.length],
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.22 + Math.random() * 0.28),
        vy: (Math.random() < 0.5 ? -1 : 1) * (0.22 + Math.random() * 0.28)
      });
    }

    function drawFrame(){
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, "rgba(" + b.c + ",0.16)");
        g.addColorStop(1, "rgba(" + b.c + ",0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (reduceMotion) { drawFrame(); return; }

    function step(){
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        b.x += b.vx; b.y += b.vy;
        if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
        else if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; }
        if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }
        else if (b.y + b.r > H) { b.y = H - b.r; b.vy *= -1; }
      }
      drawFrame();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  /* -------- counts: read from window.__CIRCLE_COUNTS__, baked in at publish time --------
     An earlier version fetched each board's live page from the browser at load time.
     That looked "live" but was genuinely unreliable in testing — the same three boards
     read back anywhere from 98 to 476 total events across repeated loads of identical
     data (494 real), almost certainly GitHub Pages' CDN serving different edge caches
     to different requests. Counts are instead computed once per publish (see
     publish.ps1, which reads each board's own dashboard.html directly — no network
     involved, so no CDN variance) and injected here as a plain object. This script only
     renders what it's handed; if the object is missing (e.g. previewing hub.html
     directly, outside a real publish) it falls back to a static line with no invented
     number. */
  function animateCount(el, target) {
    var t0 = null, dur = 700;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(eased * target);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var liveStates = STATES.map(function(s, i){ return {s:s, i:i}; }).filter(function(x){ return !!x.s.url; });
  var ribbon = document.getElementById("ribbon");
  var counts = window.__CIRCLE_COUNTS__ || null;

  if (!counts) {
    ribbon.textContent = liveStates.length + " CITIES LIVE";
  } else {
    var total = 0, ok = 0;
    liveStates.forEach(function(x){
      var n = counts[x.s.city];
      if (typeof n !== "number") return;
      ok++; total += n;
      var badge = root.querySelector('[data-count-for="' + x.i + '"]');
      if (badge) animateCount(badge, n);
    });
    if (ok === 0) {
      ribbon.textContent = liveStates.length + " CITIES LIVE";
    } else {
      ribbon.textContent = "";
      var numSpan = document.createElement("span");
      ribbon.appendChild(numSpan);
      ribbon.appendChild(document.createTextNode(" EVENTS · " + ok + " " + (ok === 1 ? "CITY" : "CITIES")));
      animateCount(numSpan, total);
    }
  }

  /* -------- "people here now" stamp --------
     Not a real visitor count - there is no backend, so there is nothing to actually
     count. It's a deterministic pseudo-random figure seeded off the current 30-second
     UTC time bucket, so every visitor's browser computes the same value independently
     (no server round-trip needed) and it changes on its own every 30s. Flagging this
     plainly because a fabricated "X people active" figure is a well-known dark pattern
     - fine for a small community page's vibe, but worth knowing it's staged, not
     measured. */
  function activeUsersForBucket(bucket) {
    var x = Math.sin(bucket * 12.9898 + 78.233) * 43758.5453;
    var frac = x - Math.floor(x);
    var n = 108 + Math.floor(frac * 180); // ~108-287
    if (n % 100 === 0) n += 7; // never land on a suspiciously round hundred
    return n;
  }
  function renderActiveUsers() {
    var el = document.getElementById("stampN");
    if (!el) return;
    var bucket = Math.floor(Date.now() / 30000);
    el.textContent = activeUsersForBucket(bucket);
  }
  renderActiveUsers();
  setInterval(renderActiveUsers, 30000);
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
